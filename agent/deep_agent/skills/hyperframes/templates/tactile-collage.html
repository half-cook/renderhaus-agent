<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tactile collage recipe</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; }
      #tpc-root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #e9dfcc; color: #25231f; font-family: Arial, sans-serif; font-synthesis: none; }
      .clip { position: absolute; }
      .tpc-motion { opacity: 0; }
      #tpc-note { left: 170px; top: 350px; width: 740px; height: 520px; }
      #tpc-note-motion { height: 100%; padding: 80px 60px; background: #fffaf0; border: 4px solid #25231f; box-shadow: 10px 12px 0 #25231f; }
      .tpc-tape { position: absolute; top: -22px; left: 240px; width: 250px; height: 48px; background: #d5bf83; opacity: 0.8; }
      .tpc-label { margin-bottom: 35px; color: #3159c8; font: 700 32px/1.1 monospace; letter-spacing: 2px; }
      .tpc-thought { font-size: 66px; line-height: 1.15; font-weight: 700; }
      #tpc-route { left: 310px; top: 900px; width: 460px; height: 30px; }
      #tpc-route-motion { stroke: #3159c8; stroke-width: 6px; stroke-dasharray: 460; stroke-dashoffset: 460; }
      #tpc-stamp { left: 250px; top: 975px; width: 580px; }
      #tpc-stamp-motion { padding: 14px; border: 5px solid #416649; color: #416649; font-size: 54px; font-weight: 700; text-align: center; }
      .tpc-caption { left: 120px; top: 1190px; width: 840px; height: 150px; display: grid; place-items: center; }
      .tpc-caption .tpc-motion { max-width: 840px; padding: 18px 25px; background: #fffaf0; border: 4px solid #25231f; box-shadow: 7px 7px 0 #25231f; font: 700 46px/1.12 monospace; text-align: center; }
      .tpc-accent { color: #3159c8; }
    </style>
  </head>
  <body>
    <div id="tpc-root" data-composition-id="tactile-collage" data-width="1080" data-height="1920" data-fps="30" data-duration="8">
      <div id="tpc-note" class="clip" data-start="0.4" data-duration="7.4"><div id="tpc-note-motion" class="tpc-motion"><div class="tpc-tape"></div><div class="tpc-label">A thought worth sharing</div><div class="tpc-thought">A small thought<br>can become<br>a shared idea.</div></div></div>
      <div id="tpc-route" class="clip" data-start="2.8" data-duration="5"><svg viewBox="0 0 460 30" width="460" height="30" aria-hidden="true"><path id="tpc-route-motion" d="M0 15 H460" fill="none"></path></svg></div>
      <div id="tpc-stamp" class="clip" data-start="5.2" data-duration="2.6"><div id="tpc-stamp-motion" class="tpc-motion">Keep it moving</div></div>
      <div id="tpc-cue-one" class="clip tpc-caption" data-start="0.4" data-duration="2.3"><div id="tpc-cue-one-motion" class="tpc-motion">Start with a <span class="tpc-accent">thought</span></div></div>
      <div id="tpc-cue-two" class="clip tpc-caption" data-start="2.8" data-duration="2.2"><div id="tpc-cue-two-motion" class="tpc-motion">Give it a <span class="tpc-accent">direction</span></div></div>
      <div id="tpc-cue-three" class="clip tpc-caption" data-start="5.2" data-duration="2.6"><div id="tpc-cue-three-motion" class="tpc-motion">Make room to <span class="tpc-accent">share</span></div></div>
    </div>
    <script>
      const timeline = gsap.timeline({ paused: true });
      timeline.fromTo("#tpc-note-motion", { opacity: 0, y: 24, rotation: -4 }, { opacity: 1, y: 0, rotation: -2, duration: 0.6, ease: "power3.out" }, 0.4);
      timeline.fromTo("#tpc-route-motion", { strokeDashoffset: 460 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.8);
      timeline.fromTo("#tpc-stamp-motion", { opacity: 0, scale: 0.95, rotation: 4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "power3.out" }, 5.2);
      timeline.fromTo("#tpc-cue-one-motion", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 0.4);
      timeline.to("#tpc-cue-one-motion", { opacity: 0, duration: 0.18 }, 2.52);
      timeline.fromTo("#tpc-cue-two-motion", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 2.8);
      timeline.to("#tpc-cue-two-motion", { opacity: 0, duration: 0.18 }, 4.82);
      timeline.fromTo("#tpc-cue-three-motion", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 5.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["tactile-collage"] = timeline;
    </script>
  </body>
</html>
