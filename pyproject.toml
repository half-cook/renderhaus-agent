[project]
name = "renderhaus-agent"
version = "0.1.0"
description = "Renderhaus API and Deep Agents backend."
requires-python = ">=3.11"
dependencies = [
  "bedrock-agentcore>=1.0.0",
  "boto3>=1.35.0",
  "clerk-backend-api>=6.0.0",
  "deepagents==0.7.23",
  "langchain==1.4.3",
  "langchain-core==1.6.8",
  "langgraph==1.2.14",
  "langgraph-checkpoint==4.2.0",
  "langchain-openai==1.7.0",
  "langchain-anthropic==1.7.5",
  "langchain-aws==1.8.1",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "httpx2>=2.12.0,<3",
  "jsonschema>=4.23.0",
  "mcp>=2.1.1,<3",
  "openai-codex==0.154.0",
  "opentimelineio==0.18.1",
  "pillow>=12.3.0,<13",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "remotion-lambda==4.0.515",
  "stripe>=11.0.0",
  "uvicorn>=0.30.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on real breakage; expand later when cleaning style.
select = ["E9", "F"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "server*", "lambdas*", "providers*"]

[tool.setuptools]
include-package-data = true
license-files = ["third_party/video-use/LICENSE", "third_party/hyperframes/LICENSE", "third_party/hyperframes/NOTICE", "third_party/hyperframes-cinematic-caption/LICENSE", "third_party/hyperframes-tactile-collage/LICENSE"]

[tool.setuptools.package-data]
"providers.elevenlabs" = ["openapi.json"]
"providers.remotion" = ["ad_layouts.json"]

"agent.deep_agent" = ["AGENTS.md", "routing_policy.json", "continuity_qc_calibration.json", "continuity_qc_vlm_eval.json", "skills/*/SKILL.md", "skills/hyperframes/templates/*.html", "skills/hyperframes/templates/*.json", "skills/hyperframes/references/*.md"]
