[project]
name = "renderhaus-agent"
version = "0.1.0"
description = "Basic LangChain agent wired to generation MCP servers."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "clerk-backend-api>=6.0.0",
  "fastapi>=0.115.0",
  "fastmcp>=2.0.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "langchain>=1.0.0",
  "langchain-mcp-adapters>=0.3.0",
  "langchain-openai>=1.0.0",
  "langfuse>=3.0.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "tenacity>=8.5.0",
  "uvicorn>=0.30.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on real breakage; expand later when cleaning style.
select = ["E9", "F"]
ignore = ["F401"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "mcps*", "web*", "lambdas*"]

[tool.setuptools.package-data]
web = ["static/*", "static/img/*"]

[tool.setuptools]
include-package-data = true
