[project]
name = "renderhaus-agent"
version = "0.1.0"
description = "Renderhaus API and OpenAI Agents SDK harness."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "boto3>=1.35.0",
  "clerk-backend-api>=6.0.0",
  "fastapi>=0.115.0",
  "fastmcp>=2.0.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on real breakage; expand later when cleaning style.
select = ["E9", "F"]
ignore = ["F401"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "mcps*", "server*", "lambdas*", "providers*"]

[tool.setuptools]
include-package-data = true
