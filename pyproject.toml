[project]
name = "renderhaus-agent"
version = "0.1.0"
description = "Renderhaus API and OpenAI Agents SDK harness."
requires-python = ">=3.11"
dependencies = [
  "bedrock-agentcore>=1.0.0",
  "boto3>=1.35.0",
  "clerk-backend-api>=6.0.0",
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "openai-agents>=0.22.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "remotion-lambda==4.0.515",
  "stripe>=11.0.0",
  "uvicorn>=0.30.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on real breakage; expand later when cleaning style.
select = ["E9", "F"]
ignore = ["F401"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "server*", "lambdas*", "providers*"]

[tool.setuptools]
include-package-data = true
