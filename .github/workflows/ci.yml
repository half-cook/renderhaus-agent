name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renderhaus_canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Keep CI free of Secrets Manager / paid providers.
      RENDERHAUS_SECRETS_NAME: ""
      SEEDANCE_DRY_RUN: "true"
      SEEDREAM_DRY_RUN: "true"
      MUREKA_DRY_RUN: "true"
      FISH_AUDIO_DRY_RUN: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/renderhaus_canvas_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/renderhaus_canvas_test
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Node isn't used by this job yet — it lands with the M2 contract
      # export/generate/diff pipeline (design/merge-doc.md §4). Set up now so
      # that milestone is a script addition here, not a workflow rewrite.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Ruff
        run: ruff check agent mcps lambdas scripts server providers tests

      - name: CI checks
        run: python scripts/ci_check.py

      - name: Apply canvas migrations
        run: python -m alembic upgrade head

      - name: Canvas tests
        run: python -m pytest -q
