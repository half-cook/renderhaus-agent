name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff
        run: ruff check agent mcps lambdas scripts server providers

      - name: CI checks
        run: python scripts/ci_check.py
        env:
          # Keep CI free of Secrets Manager / paid providers.
          RENDERHAUS_SECRETS_NAME: ""
          SEEDANCE_DRY_RUN: "true"
          SEEDREAM_DRY_RUN: "true"
          MUREKA_DRY_RUN: "true"
          FISH_AUDIO_DRY_RUN: "true"
